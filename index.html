<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda fakest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos/estilos.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">Tienda fakest </a>
            <form class="d-flex mx-auto" style="width: 400px;">
                <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Search">
            </form>
            <button class="btn btn-outline-dark position-relative" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
                <i class="fas fa-shopping-cart"></i> Carrito
                <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 sidebar p-4 d-flex flex-column">
                <h6 class="fw-bold mb-3">Ordenar por:</h6>
                <ul class="list-unstyled mb-4 text-muted sidebar-list">
                    <li>
                        <button class="btn btn-link text-decoration-none sort-btn w-100 d-flex align-items-center justify-content-between p-0" onclick="sortProducts('price')">
                            <span class="d-flex align-items-center"><i class="fas fa-dollar-sign me-2"></i> Precio</span>
                            <i class="fas fa-chevron-right text-muted small"></i>
                        </button>
                    </li>
                    <li>
                        <button class="btn btn-link text-decoration-none sort-btn w-100 d-flex align-items-center justify-content-between p-0" onclick="sortProducts('name')">
                            <span class="d-flex align-items-center"><i class="fas fa-sort-alpha-down me-2"></i> A - Z</span>
                            <i class="fas fa-chevron-right text-muted small"></i>
                        </button>
                    </li>
                </ul>

                <h6 class="fw-bold mb-3">Categorías</h6>
                <ul class="list-unstyled text-muted sidebar-list mb-auto" id="categories-list">
                    <li>
                        <a href="#" class="text-decoration-none text-muted d-flex align-items-center justify-content-between">
                            Juegos
                            <i class="fas fa-chevron-right text-muted small"></i>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="text-decoration-none text-muted d-flex align-items-center justify-content-between">
                            Ropa
                            <i class="fas fa-chevron-right text-muted small"></i>
                        </a>
                    </li>
                </ul>

                <div class="d-flex justify-content-start gap-2 pt-3 border-top mt-auto">
                    <button class="btn btn-light btn-sm"><i class="fas fa-sun"></i></button>
                    <button class="btn btn-light btn-sm text-muted">ES</button>
                    <button class="btn btn-light btn-sm text-muted">EN</button>
                </div>
            </div>

            <div class="col-md-9 col-lg-10 p-4 bg-light">
                <div class="row" id="product-grid">
                    <div class="text-center mt-5" id="loading-spinner">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Cargando productos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modal-title">Detalle del Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-5 text-center">
                            <img id="modal-img" src="" alt="Producto" class="img-fluid p-3" style="max-height: 300px;">
                        </div>
                        <div class="col-md-7 d-flex flex-column justify-content-center">
                            <h4 class="price-text-magenta mb-3" id="modal-price"></h4>
                            <span class="badge bg-secondary mb-3 align-self-start" id="modal-category"></span>
                            <p class="text-muted" id="modal-desc"></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title" id="cartOffcanvasLabel"><i class="fas fa-shopping-cart"></i> Mi Carrito</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="cart-items" class="flex-grow-1 overflow-auto">
                <p class="text-muted text-center mt-4">Tu carrito está vacío.</p>
            </div>
            <div class="border-top pt-3 mt-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0 fw-bold">Total:</h5>
                    <h4 class="mb-0 price-text-magenta" id="cart-total">$0.00</h4>
                </div>
                <button class="btn btn-success w-100 fw-bold py-2">Proceder al Pago</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/main.js"></script>
</body>
</html>
